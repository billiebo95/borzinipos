name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run :core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: borzini-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release signing is optional: this step never fails and never uses `secrets` inside an
      # `if:` (GitHub Actions does not allow the secrets context there) - instead it decodes the
      # keystore when the secret is non-empty and records the result as a step output, which the
      # later steps' `if:` conditions are allowed to read.
      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.BORZINI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/borzini_release.jks"
            echo "path=$RUNNER_TEMP/borzini_release.jks" >> "$GITHUB_OUTPUT"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK (signed, only if keystore secrets are configured)
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          BORZINI_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          BORZINI_KEYSTORE_PASSWORD: ${{ secrets.BORZINI_KEYSTORE_PASSWORD }}
          BORZINI_KEY_ALIAS: ${{ secrets.BORZINI_KEY_ALIAS }}
          BORZINI_KEY_PASSWORD: ${{ secrets.BORZINI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: borzini-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run :core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: borzini-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore (if configured)
        id: keystore
        if: ${{ secrets.BORZINI_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.BORZINI_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/borzini_release.jks"
          echo "path=$RUNNER_TEMP/borzini_release.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK (signed, only if keystore secrets are configured)
        if: ${{ secrets.BORZINI_KEYSTORE_BASE64 != '' }}
        env:
          BORZINI_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          BORZINI_KEYSTORE_PASSWORD: ${{ secrets.BORZINI_KEYSTORE_PASSWORD }}
          BORZINI_KEY_ALIAS: ${{ secrets.BORZINI_KEY_ALIAS }}
          BORZINI_KEY_PASSWORD: ${{ secrets.BORZINI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ secrets.BORZINI_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: borzini-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
